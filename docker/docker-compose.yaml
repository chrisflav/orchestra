name: orchestra

# Shared by both services below. The dashboard needs it for the same reason the daemon does:
# whichever container starts first renders config.json from it (see docker/entrypoint.sh), and
# the dashboard reads the same file to list authentication sources.
x-orchestra-env: &orchestra-env
  # The record store. Required, and with no default: every task, queue entry, concert run and
  # listener state is a row in this database, and there is no file to fall back to. The `db`
  # service below is what this points at out of the box; point it elsewhere to use a server you
  # already run, in which case you can remove that service and its volume.
  ORCHESTRA_DATABASE_URL: ${ORCHESTRA_DATABASE_URL:-postgresql://orchestra:orchestra@db:5432/orchestra}
  # taxis instance backing projects/issues/claims. Required — every project, issue and claim
  # operation fails without it. This compose file expects taxis to be running elsewhere; point
  # the URL at it. If taxis runs in its own compose project on the same host, use its
  # container name plus a shared network, or the host gateway (see docker/README.md).
  # (Left unset-tolerant so `docker compose build` works without a .env; the entrypoint fails
  # with a clear message at start-up if it's still empty and no config.json is mounted.)
  ORCHESTRA_TAXIS_URL: ${ORCHESTRA_TAXIS_URL:-}
  ORCHESTRA_TAXIS_TOKEN: ${ORCHESTRA_TAXIS_TOKEN:-}
  # GitHub auth: a PAT is the simple path; the GitHub App fields are the alternative and need
  # the private key mounted at the path given.
  ORCHESTRA_GITHUB_PAT: ${ORCHESTRA_GITHUB_PAT:-}
  ORCHESTRA_GITHUB_APP_ID: ${ORCHESTRA_GITHUB_APP_ID:-0}
  # Path *inside* the container — i.e. under /secrets, see the volume below. Left empty by
  # default so PAT users get no spurious "key missing" warning at start-up.
  ORCHESTRA_GITHUB_PRIVATE_KEY_PATH: ${ORCHESTRA_GITHUB_PRIVATE_KEY_PATH:-}
  # Agent auth: one of these, depending on how you authenticate Claude.
  ORCHESTRA_CLAUDE_TOKEN: ${ORCHESTRA_CLAUDE_TOKEN:-}
  ORCHESTRA_ANTHROPIC_API_KEY: ${ORCHESTRA_ANTHROPIC_API_KEY:-}

services:
  orchestra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orchestra:latest
    restart: unless-stopped
    # `docker compose stop` sends SIGTERM to the daemon (PID 1 in this image), which orchestra
    # catches and treats as "finish the tasks already running, then exit" — the same drain as
    # `orchestra queue shutdown`. Docker's default 10s grace period would SIGKILL it long before
    # an agent task is done, killing the task mid-run and leaving its entry stuck in `running`,
    # so allow for a realistic task instead. Nothing waits out the full period: the daemon exits
    # as soon as the last in-flight task lands. A second SIGTERM (stop again, or Ctrl-C twice in
    # the foreground) cancels the running tasks rather than waiting for them.
    stop_grace_period: ${ORCHESTRA_STOP_GRACE_PERIOD:-30m}
    environment: *orchestra-env
    # `service_healthy`, not the bare form: a first `up` creates the cluster, and the daemon's
    # first act is to apply its schema. Starting it against a server that is still initialising
    # buys a failed start and a thirty-second restart wait for nothing.
    depends_on:
      db:
        condition: service_healthy
    # Upstream resolvers, when the host's own are unusable from a container — see
    # docker/README.md's "error connecting to api.github.com". Empty (the default) changes
    # nothing.
    dns: ${ORCHESTRA_DNS:-}

    # No seccomp/apparmor relaxation here on purpose: orchestra sandboxes every agent with landrun
    # (Landlock), and that was verified to work under Docker's *default* seccomp profile — the
    # landlock_* syscalls are allowlisted in current versions. If you are on an older Docker where
    # they aren't, the entrypoint says so at start-up; see docker/README.md before reaching for
    # `security_opt: [seccomp=unconfined]`, which is a much bigger hammer than the problem needs.
    volumes:
      # Plain host directories rather than named volumes, so config and state are inspectable and
      # editable without `docker cp`. All three are gitignored. Docker creates them on first `up`
      # (as root); the entrypoint takes ownership before dropping to the `orchestra` user.
      #
      # ./config/orchestra/config.json is generated on first start from the environment above.
      # Edit it in place afterwards — it is then used as-is and the environment is ignored. The
      # same directory holds listeners/, roles/, prompts/ and secrets.json.
      - ./config:/config
      # Cloned repos, task logs, per-project roles, the dashboard secret. The records themselves
      # are not here any more — they are rows in the `db` service — but this still has to be the
      # same directory the dashboard mounts, because the dashboard serves task logs out of it and
      # reaches the daemon's control socket through it.
      - ./data:/data
      # GitHub App private key and anything else secret. Mounted read-only, and as a *directory*
      # rather than naming the .pem directly: Docker silently creates a directory in place of a
      # missing bind-mounted file, which would surface later as a confusing openssl error.
      # Drop your key in ./secrets/ and set ORCHESTRA_GITHUB_PRIVATE_KEY_PATH to its path here.
      - ${ORCHESTRA_SECRETS_DIR:-./secrets}:/secrets:ro

  # The web console and the HTTP API: `orchestrad dashboard` over the same /config and /data.
  #
  # A separate container rather than a thread inside the daemon, because the two have opposite
  # restart characteristics: the daemon drains for up to `stop_grace_period` on every stop, and
  # tying the console to that would make it unavailable exactly when someone is trying to look at
  # why a task is stuck. (`orchestrad serve` runs both in one process, which is the right shape
  # for a single-host install and the wrong one here.)
  #
  # Nothing here dispatches work. It reads the records the daemon writes — rows of the `db`
  # service — and it writes the configuration files the daemon reads, listeners, roles and skills,
  # which the daemon picks up without a restart. It can also ask the daemon to cancel one running
  # task, which travels over the daemon's control socket in /data rather than over any port.
  #
  # Two clients of one database, which is a thing a database is for; this used to be two processes
  # on one SQLite file, which is a thing a file is not, and the arrangement needed /data to be one
  # ordinary local directory — no NFS, no SMB — for WAL to work across them at all. What is left
  # of that constraint is much weaker: both still mount the same /data, because the console serves
  # task logs out of it and finds the daemon's socket in it.
  dashboard:
    # Same build as above so `docker compose build` produces the one image both services use;
    # Compose builds it once and reuses it.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: orchestra:latest
    restart: unless-stopped
    # `--site` serves the front-end the Dockerfile's Node stage built, so one port answers both
    # the HTML and the JSON API and no CORS hop is involved. `--host 0.0.0.0` is required
    # *inside* a container: the default binds loopback, which nothing outside the container can
    # reach. Exposure is controlled by the published port below, not by this.
    command:
      - orchestrad
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --site
      - /opt/orchestra/dashboard-site
    ports:
      # Published on the loopback interface of the *host* by default: the API is plain HTTP and
      # gated only by a password, so it should not be on a LAN — let alone the internet —
      # without a reverse proxy terminating TLS in front of it. Set ORCHESTRA_DASHBOARD_BIND to
      # 0.0.0.0 (or a specific interface address) once something is doing that, and add
      # `--secure-cookie` to the command above so the session cookie is HTTPS-only.
      - "${ORCHESTRA_DASHBOARD_BIND:-127.0.0.1}:${ORCHESTRA_DASHBOARD_PORT:-8080}:8080"
    # Deliberately *not* `<<: *orchestra-env`. This is the one container reachable from outside,
    # and it needs none of the daemon's credentials: it dispatches nothing, opens no PR, and
    # runs no agent. Only taxis is here, because the projects and issues pages read it. The
    # entrypoint also skips rendering config.json in this container precisely because it does
    # not hold the rest (see docker/entrypoint.sh).
    environment:
      # The exception to the paragraph above, and not a credential the daemon holds: this
      # container's whole job is reading the records, so it needs the database the records are
      # in. The same URL as the daemon's, because it is the same database.
      ORCHESTRA_DATABASE_URL: ${ORCHESTRA_DATABASE_URL:-postgresql://orchestra:orchestra@db:5432/orchestra}
      ORCHESTRA_TAXIS_URL: ${ORCHESTRA_TAXIS_URL:-}
      ORCHESTRA_TAXIS_TOKEN: ${ORCHESTRA_TAXIS_TOKEN:-}
      # The password the dashboard asks for. Leave it unset to have one generated and persisted
      # to data/orchestra/dashboard.secret on first start — the container prints it, so
      # `docker compose logs dashboard` is the quickest way to read it.
      ORCHESTRA_DASHBOARD_PASSWORD: ${ORCHESTRA_DASHBOARD_PASSWORD:-}
    # So the daemon is the container that renders config.json on a first `up`; the dashboard
    # never writes one. Compose only orders the *starts*, so the dashboard can come up before
    # config.json exists — the auth page re-reads it per request and fills in on its own.
    depends_on:
      orchestra:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      # Read-write since taxis #433: the API this container serves is how listeners, roles and
      # skills are edited, and those live under /config. It still never writes config.json itself
      # — the entrypoint skips rendering one here precisely because this container is not given
      # the credentials that would go in it.
      - ./config:/config
      # Task history, queue state, and the persisted dashboard secret.
      - ./data:/data

  # The record store.
  #
  # Here so that `docker compose up` is the whole of getting an installation running, the way it
  # was when the records were a file under ./data. Point ORCHESTRA_DATABASE_URL at a server you
  # already run and this service and its volume can go; nothing else refers to them.
  #
  # Publishes no port. Both clients reach it by service name on the project's default network,
  # which is the only place it needs to be reachable from — the credentials below are defaults
  # precisely because nothing outside this network can use them.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORCHESTRA_DB_USER:-orchestra}
      POSTGRES_PASSWORD: ${ORCHESTRA_DB_PASSWORD:-orchestra}
      POSTGRES_DB: ${ORCHESTRA_DB_NAME:-orchestra}
    # A named volume rather than a bind mount, unlike ./config and ./data: those two are meant to
    # be read and edited by hand, and this one is a database's own storage, which is not. Removing
    # it is `docker compose down -v`, deliberately harder than deleting a directory.
    volumes:
      - orchestra-db:/var/lib/postgresql/data
    # `pg_isready` rather than a TCP probe: the container accepts connections briefly during
    # initialisation, while it is still creating the cluster, and a daemon that connected then
    # would fail its first query rather than wait.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHESTRA_DB_USER:-orchestra} -d ${ORCHESTRA_DB_NAME:-orchestra}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  orchestra-db:
