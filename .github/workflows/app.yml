name: App CI

# The native client under `app/`. It has its own toolchain — npm and cargo, no Lake — so it has
# its own workflow, and one that only runs when something under `app/` moved.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  # So an APK can be built on demand, without a push.
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  # The fast half: types, lints and the core's own tests, on one platform. Everything that can
  # fail without a webview fails here, in a couple of minutes, rather than three times over in
  # the matrix below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: npm ci
      - run: npm run typecheck

      # `generate_context!` reads the built front-end, so the bundle has to exist before
      # anything cargo does will compile.
      - run: npm run build

      - name: Rust format
        run: cargo fmt --check
        working-directory: app/src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

      - name: Core tests
        run: cargo test
        working-directory: app/src-tauri

  # The slow half: does it actually bundle on each desktop platform. This is what keeps
  # "platform independent" a fact rather than a claim.
  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev librsvg2-bin \
            libsoup-3.0-dev patchelf fuse3

      - run: npm ci

      # The repository tracks the PNGs the Linux bundles use; macOS wants an `.icns` and
      # Windows an `.ico`, which this derives from the same master rather than committing three
      # copies of one drawing.
      - name: Generate the icon set
        run: npx tauri icon src-tauri/icons/icon.png

      # Unsigned. Signing and notarisation are release-time concerns and want secrets this
      # workflow deliberately does not have.
      - name: Build the bundle
        run: npx tauri build --bundles ${{ matrix.name == 'linux' && 'deb' || matrix.name == 'macos' && 'app' || 'msi' }}

      - uses: actions/upload-artifact@v4
        with:
          name: orchestra-app-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.app
            app/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 7

  # The phone. This is also where an APK comes from: the Android SDK, the NDK and Google's
  # Maven repository are all on hosts a development container may not be allowed to reach,
  # and a runner is.
  #
  # A *debug* APK, signed with the debug keystore Gradle generates, because that is the one
  # that installs on a handset without a signing identity. A release APK would need a keystore
  # this workflow deliberately does not hold — see `docs/native-app.md` on signing.
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # `NDK_HOME` is what the Tauri CLI looks for, and it is not what the SDK sets. Exported
      # once here rather than repeated on each step below, so the version appears twice in this
      # file instead of four times.
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        env:
          NDK_VERSION: "27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # One per ABI a phone can have. The universal APK below carries all four, so it
          # installs on a handset and on an emulator alike.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android

      - run: npm ci

      - name: Generate the icon set
        run: npx tauri icon src-tauri/icons/icon.png

      # `android init` writes the Gradle project under `src-tauri/gen/android`, which is not
      # tracked: it is generated from `tauri.conf.json` and the icons, and regenerating it is
      # cheaper than reviewing a diff of it.
      - name: Generate the Android project
        run: npx tauri android init

      - name: Build the APK
        run: npx tauri android build --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: orchestra-app-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
