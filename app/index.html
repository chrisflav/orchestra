<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0E13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>orchestra</title>
    <!--
      Applies a saved theme before first paint. Inline and synchronous on purpose: anything
      deferred to the bundle would let the system theme render first and then swap, which is the
      flash this exists to prevent.

      The app's CSP allows exactly this script, by hash. EDITING IT — even by a character —
      changes the hash and the webview will refuse to run it, taking the pre-paint theme with
      it. The hash is `script-src` in `src-tauri/tauri.conf.json`; `app/README.md` says how to
      recompute it.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("orchestra-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* private mode: fall through to the system theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
